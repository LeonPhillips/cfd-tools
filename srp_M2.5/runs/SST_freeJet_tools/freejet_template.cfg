% srp_M2.5 free jet (no counterflow), case @CASE@, mesh@MESH@, k-omega SST, SLAU2 + Venkatakrishnan-Wang (user, 2026-11-23).
% @STAGE_NOTE@
% Made by SST_freeJet_tools/setup_freejet.sh (cfd-tools @COMMIT@). Nothing stops on convergence.
% ---- physics ----------------------------------------------------------------------------
SOLVER= RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= V2003m   % standard SST-2003m, no compressibility correction, as the srp_M2.5 runs
MATH_PROBLEM= DIRECT
AXISYMMETRIC= YES
RESTART_SOL= @RESTART@
SOLUTION_FILENAME= @SOLUTION@
% ---- ambient: still air at 1 atm, 288.15 K (user, 2026-11-23) ---------------------------
% The reference state, and the initial field of the first stage on the coarse mesh, is the ambient with a token
% Mach 0.01 in +x (3.4 m/s; SU2 needs a non-zero velocity for the turbulence reference). The boundaries hold the
% ambient at rest: total p = 101325 Pa, total T = 288.15 K where air is entrained. The outlet is a characteristic
% far-field at this freestream state (101325 Pa, 288.15 K, Mach 0.01 in +x; user, 2026-11-23).
MACH_NUMBER= 0.01
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15
INIT_OPTION= TD_CONDITIONS
REF_DIMENSIONALIZATION= DIMENSIONAL
FREESTREAM_TURBULENCEINTENSITY= 0.01
FREESTREAM_TURB2LAMVISCRATIO= 1.0
% ---- gas: air, ideal gas, Sutherland ---------------------------------------------------
FLUID_MODEL= STANDARD_AIR
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058
VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.716E-5
MU_T_REF= 273.15
SUTHERLAND_CONSTANT= 110.4
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
PRANDTL_TURB= 0.90
% ---- force reference: body diameter 18 mm (CD for information only) ---------------------
REF_ORIGIN_MOMENT_X= 0.0
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 0.018
REF_AREA= 2.54469E-4
% ---- boundaries -------------------------------------------------------------------------
% inlet_jet: the same total-conditions jet inlet as the srp_M2.5 runs, p0j 6.6 bar, T0j 288.15 K, flow in +x.
% ambient_side (r = 120 mm) and ambient_rear (x = -308.1 mm): entrainment inlets at the ambient total state, flow
% normal into the domain. outlet (x = 240 mm): far-field (Riemann) at the freestream state, so flow may cross it
% either way (user, 2026-11-23: the static-pressure outlet broke down when the jet's starting vortex reached it).
% Model walls adiabatic, no slip.
MARKER_HEATFLUX= ( wall_noslip, 0.0 )
INLET_TYPE= TOTAL_CONDITIONS
MARKER_INLET= ( inlet_jet, 288.15, 660000.0, 1.0, 0.0, 0.0, ambient_side, 288.15, 101325.0, 0.0, -1.0, 0.0, ambient_rear, 288.15, 101325.0, 1.0, 0.0, 0.0 )
MARKER_INLET_TURBULENT= ( inlet_jet, 0.02, 10.0, ambient_side, 0.01, 1.0, ambient_rear, 0.01, 1.0 )
MARKER_FAR= ( outlet )
MARKER_SYM= ( axis )
MARKER_PLOTTING= ( wall_noslip )
MARKER_MONITORING= ( wall_noslip )
MARKER_ANALYZE= ( inlet_jet, ambient_side, ambient_rear, outlet )
MARKER_ANALYZE_AVERAGE= MASSFLUX
% ---- numerics (as the SLAU2-VW srp_M2.5 runs) --------------------------------------------
CONV_NUM_METHOD_FLOW= SLAU2
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN_WANG
VENKAT_LIMITER_COEFF= 0.05
@MUSCL_RAMP@
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
NUM_METHOD_GRAD= GREEN_GAUSS
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_NUMBER= @CFL0@
CFL_ADAPT= @CFL_ADAPT@
% (factor down, factor up, CFL min, CFL max, acceptable linear residual, starting iteration)
CFL_ADAPT_PARAM= ( 0.5, 1.01, 0.1, @CAP@, 0.001, 0 )
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 0
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 20
MGLEVEL= 0
% ---- convergence ------------------------------------------------------------------------
ITER= @ITER@
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -20   % unreachable: runs never stop on a convergence test (user, 2026-10-28)
CONV_CAUCHY_ELEMS= 999
CONV_CAUCHY_EPS= 1E-10
CONV_STARTITER= 2000
% ---- input / output ---------------------------------------------------------------------
MESH_FILENAME= @MESHFILE@
MESH_FORMAT= SU2
SCREEN_OUTPUT= ( INNER_ITER, WALL_TIME, RMS_DENSITY, REL_RMS_DENSITY, RMS_TKE, RMS_DISSIPATION, AVG_CFL, LINSOL_RESIDUAL )
SCREEN_WRT_FREQ_INNER= 10
HISTORY_OUTPUT= ( ITER, WALL_TIME, RMS_RES, REL_RMS_RES, CFL_NUMBER, LINSOL, AERO_COEFF, FLOW_COEFF, FLOW_COEFF_SURF )
HISTORY_WRT_FREQ_INNER= 1
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_PARAVIEW )
OUTPUT_WRT_FREQ= @WRT@
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE, RESIDUAL )
CONV_FILENAME= history
RESTART_FILENAME= restart
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface
WRT_VOLUME_OVERWRITE= @OVERWRITE@
